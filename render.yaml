services:
  - type: web
    name: Dalvin
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd dolanda && npm install
    startCommand: cd dolanda && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dolanda-production-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
